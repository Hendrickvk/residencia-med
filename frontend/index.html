<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conduta</title>
    <meta
      name="description"
      content="Banco de questões, painel de desempenho, revisão espaçada e simulados para ENAMED e Revalida."
    />

    <!-- A marca é o próprio símbolo da triagem (DESIGN_TRIAGEM.md §3): as cinco
         barras, em SVG na aba e em PNG escuro na tela de início do celular. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Conduta" />
    <!-- A barra do navegador no celular não segue o CSS da página: sem isto ela
         fica branca por cima do app no tema escuro. O valor sai do `--ground` do
         tema em vigor e é atualizado pelo `aplicarTema` (lib/theme.ts). -->
    <meta name="theme-color" content="#f2f3ef" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
